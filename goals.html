<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Goals | Spendly</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/refined.css" />
  </head>
  <body data-page="goals">
    <div class="app-shell">
      <div id="sidebarMount"></div>
      <section class="page-area">
        <div id="topbarMount"></div>
        <main class="page-content">
          <div class="section-header">
            <h1 class="page-heading" style="margin: 0">Goals</h1>
            <div style="display: flex; align-items: center; gap: 12px">
              <span class="muted" style="font-size: 11px">Currency: NPR</span>
              <button id="openGoalModal" class="primary-button">
                Add Goal
              </button>
            </div>
          </div>
          <section class="card card-padding">
            <div id="goalList" class="goal-list"></div>
          </section>

          <div id="goalModal" class="modal-backdrop">
            <section class="modal">
              <div class="modal-header">
                <h2>Create Saving Goal</h2>
                <button class="modal-close" data-close-modal="goalModal">
                  &times;
                </button>
              </div>
              <form id="goalForm">
                <div class="form-group">
                  <label for="goalTitle">Goal Name</label
                  ><input class="form-control" id="goalTitle" required />
                </div>
                <div class="form-group">
                  <label for="goalTarget">Target Amount (NPR)</label
                  ><input
                    class="form-control"
                    id="goalTarget"
                    type="number"
                    min="1"
                    step="0.01"
                    required
                  />
                </div>
                <div class="form-group">
                  <label for="goalSaved">Already Saved (NPR)</label
                  ><input
                    class="form-control"
                    id="goalSaved"
                    type="number"
                    min="0"
                    step="0.01"
                    value="0"
                  />
                </div>
                <div class="form-group">
                  <label for="goalDue">Target Date</label
                  ><input
                    class="form-control"
                    id="goalDue"
                    type="date"
                    required
                  />
                </div>
                <div class="modal-actions">
                  <button
                    type="button"
                    class="secondary-button"
                    data-close-modal="goalModal"
                  >
                    Cancel</button
                  ><button class="primary-button" type="submit">
                    Create Goal
                  </button>
                </div>
              </form>
            </section>
          </div>

          <div id="goalSavingsModal" class="modal-backdrop">
            <section
              class="modal"
              role="dialog"
              aria-modal="true"
              aria-labelledby="goalSavingsTitle"
            >
              <div class="modal-header">
                <h2 id="goalSavingsTitle">Add savings</h2>
                <button
                  type="button"
                  class="modal-close"
                  data-close-modal="goalSavingsModal"
                  aria-label="Close"
                >
                  &times;
                </button>
              </div>
              <form id="goalSavingsForm">
                <div class="form-group">
                  <label for="goalSavingsAmount">Amount (NPR)</label
                  ><input
                    id="goalSavingsAmount"
                    class="form-control"
                    type="number"
                    min=".01"
                    max="999999999"
                    step=".01"
                    required
                  />
                </div>
                <div class="modal-actions">
                  <button
                    class="secondary-button"
                    type="button"
                    data-close-modal="goalSavingsModal"
                  >
                    Cancel</button
                  ><button class="primary-button" type="submit">
                    Update savings
                  </button>
                </div>
              </form>
            </section>
          </div>
        </main>
      </section>
    </div>
    <div id="toast" class="toast"></div>
    <script src="js/app.js"></script>
    <script src="js/goals.js"></script>
  </body>
</html>
