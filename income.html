<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Add Income | Spendly</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/refined.css" />
  </head>
  <body data-page="income">
    <div class="app-shell">
      <div id="sidebarMount"></div>
      <section class="page-area">
        <div id="topbarMount"></div>
        <main class="page-content">
          <div class="form-card card">
            <header class="form-card-header">
              <h1>Record income</h1>
              <p class="muted">
                Add an allowance, salary, freelance payment or other income in
                NPR.
              </p>
            </header>
            <form id="incomeForm" class="form-body">
              <div class="form-group">
                <label for="incomeDate">Date</label
                ><input
                  class="form-control"
                  id="incomeDate"
                  type="date"
                  required
                />
              </div>
              <div class="form-group">
                <label for="incomeSource">Source</label
                ><input
                  class="form-control"
                  id="incomeSource"
                  type="text"
                  maxlength="150"
                  placeholder="e.g. Part-time work"
                  required
                />
              </div>
              <div class="form-group">
                <label for="incomeAmount">Amount (NPR)</label
                ><input
                  class="form-control"
                  id="incomeAmount"
                  type="number"
                  min="0.01"
                  step="0.01"
                  placeholder="0.00"
                  required
                />
              </div>
              <div class="income-form-actions">
                <button class="primary-button" id="incomeSave" type="submit">
                  Save income</button
                ><button
                  class="secondary-button"
                  type="button"
                  id="cancelIncomeEdit"
                  hidden
                >
                  Cancel editing
                </button>
              </div>
            </form>
          </div>
          <section class="card card-padding" style="margin-top: 24px">
            <div class="section-header">
              <h2 class="card-title">Income history</h2>
            </div>
            <div class="table-wrap">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>Date</th>
                    <th>Source</th>
                    <th>Amount</th>
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody id="incomeTable"></tbody>
              </table>
            </div>
          </section>
        </main>
      </section>
    </div>
    <div id="toast" class="toast"></div>
    <script src="js/app.js"></script>
    <script src="js/income.js"></script>
  </body>
</html>
