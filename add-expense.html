<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Expense | Spendly</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/refined.css" />
  </head>
  <body data-page="add-expense">
    <div class="app-shell">
      <div id="sidebarMount"></div>
      <section class="page-area">
        <div id="topbarMount"></div>
        <main class="page-content">
          <div class="form-card card">
            <div class="form-card-header">
              <h1>Add Expense</h1>
              <p class="muted" style="margin: 7px 0 0">
                Enter the amount in Nepalese Rupees (NPR).
              </p>
            </div>
            <form id="expenseForm" class="form-body">
              <div class="form-group">
                <label for="date">Date</label>
                <input class="form-control" id="date" type="date" required />
              </div>
              <div class="form-group">
                <label for="category">Category</label>
                <select class="form-control" id="category" required></select>
              </div>
              <div class="form-group">
                <label for="description">Description</label>
                <input
                  class="form-control"
                  id="description"
                  type="text"
                  placeholder="Enter description"
                  required
                />
              </div>
              <div class="form-group">
                <label for="amount">Amount (NPR)</label>
                <input
                  class="form-control"
                  id="amount"
                  type="number"
                  min="0.01"
                  step="0.01"
                  placeholder="Enter amount"
                  required
                />
              </div>
              <button class="primary-button full-button" type="submit">
                Save expense
              </button>
            </form>
          </div>
        </main>
      </section>
    </div>
    <div id="toast" class="toast"></div>
    <script src="js/app.js"></script>
    <script src="js/add-expense.js"></script>
  </body>
</html>
