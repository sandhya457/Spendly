<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reports | Spendly</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/refined.css" />
  </head>
  <body data-page="reports">
    <div class="app-shell">
      <div id="sidebarMount"></div>
      <section class="page-area">
        <div id="topbarMount"></div>
        <main class="page-content">
          <div class="section-header">
            <h1 class="page-heading" style="margin: 0">Reports</h1>
            <span class="muted" style="font-size: 11px"
              >Currency: Nepalese Rupee (NPR)</span
            >
          </div>
          <section class="three-column">
            <article class="card metric">
              <p>Total Spending</p>
              <strong id="reportTotal">Rs. 0.00</strong>
            </article>
            <article class="card metric">
              <p>Average Transaction</p>
              <strong id="reportAverage">Rs. 0.00</strong>
            </article>
            <article class="card metric">
              <p>Highest Expense</p>
              <strong id="reportHighest">Rs. 0.00</strong>
            </article>
          </section>
          <section class="card card-padding" style="margin-top: 18px">
            <h2 class="card-title">Spending by Category</h2>
            <div class="bar-chart" id="reportBars"></div>
          </section>
          <section class="card card-padding" style="margin-top: 18px">
            <div class="section-header"><h2>Expense history</h2></div>
            <div class="report-filters" aria-label="Filter expenses">
              <div class="form-group">
                <label for="reportSearch">Search</label
                ><input
                  id="reportSearch"
                  class="form-control"
                  type="search"
                  placeholder="Search expenses"
                />
              </div>
              <div class="form-group">
                <label for="reportCategory">Category</label
                ><select id="reportCategory" class="form-control">
                  <option value="">All categories</option>
                </select>
              </div>
              <div class="form-group">
                <label for="reportFrom">From</label
                ><input id="reportFrom" class="form-control" type="date" />
              </div>
              <div class="form-group">
                <label for="reportTo">To</label
                ><input id="reportTo" class="form-control" type="date" />
              </div>
              <button
                class="secondary-button"
                type="button"
                id="resetReportFilters"
              >
                Clear
              </button>
            </div>
            <div class="table-wrap">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>Date</th>
                    <th>Category</th>
                    <th>Description</th>
                    <th>Amount</th>
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody id="expenseTable"></tbody>
              </table>
            </div>
          </section>

          <div id="expenseEditModal" class="modal-backdrop">
            <section
              class="modal"
              role="dialog"
              aria-modal="true"
              aria-labelledby="editExpenseTitle"
            >
              <div class="modal-header">
                <h2 id="editExpenseTitle">Edit expense</h2>
                <button
                  class="modal-close"
                  data-close-modal="expenseEditModal"
                  type="button"
                  aria-label="Close"
                >
                  &times;
                </button>
              </div>
              <form id="expenseEditForm">
                <div class="form-group">
                  <label for="expenseEditDate">Date</label
                  ><input
                    class="form-control"
                    id="expenseEditDate"
                    type="date"
                    required
                  />
                </div>
                <div class="form-group">
                  <label for="expenseEditCategory">Category</label
                  ><select
                    class="form-control"
                    id="expenseEditCategory"
                    required
                  ></select>
                </div>
                <div class="form-group">
                  <label for="expenseEditDescription">Description</label
                  ><input
                    class="form-control"
                    id="expenseEditDescription"
                    maxlength="250"
                    required
                  />
                </div>
                <div class="form-group">
                  <label for="expenseEditAmount">Amount (NPR)</label
                  ><input
                    class="form-control"
                    id="expenseEditAmount"
                    type="number"
                    min=".01"
                    max="999999999"
                    step=".01"
                    required
                  />
                </div>
                <div class="modal-actions">
                  <button
                    type="button"
                    class="secondary-button"
                    data-close-modal="expenseEditModal"
                  >
                    Cancel</button
                  ><button type="submit" class="primary-button">
                    Save changes
                  </button>
                </div>
              </form>
            </section>
          </div>
        </main>
      </section>
    </div>
    <div id="toast" class="toast"></div>
    <script src="js/app.js"></script>
    <script src="js/reports.js"></script>
  </body>
</html>
