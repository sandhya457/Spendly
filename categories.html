<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Categories | Spendly</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/refined.css" />
  </head>
  <body data-page="categories">
    <div class="app-shell">
      <div id="sidebarMount"></div>
      <section class="page-area">
        <div id="topbarMount"></div>
        <main class="page-content">
          <h1 class="page-heading">Categories</h1>
          <section class="two-column">
            <article class="card card-padding">
              <h2 class="card-title">Add Category</h2>
              <form id="categoryForm">
                <div class="form-group">
                  <label for="categoryName">Category Name</label
                  ><input class="form-control" id="categoryName" required />
                </div>
                <div class="form-group">
                  <label for="categoryColor">Color</label
                  ><input
                    class="form-control"
                    id="categoryColor"
                    type="color"
                    value="#5a4bc7"
                    required
                  />
                </div>
                <button class="primary-button" type="submit">
                  Add Category
                </button>
              </form>
            </article>
            <article class="card card-padding">
              <h2 class="card-title">Your Categories</h2>
              <div id="categoryList" class="category-manager"></div>
            </article>
          </section>
        </main>
      </section>
    </div>
    <div id="toast" class="toast"></div>
    <script src="js/app.js"></script>
    <script src="js/categories.js"></script>
  </body>
</html>
